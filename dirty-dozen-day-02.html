        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      }
      const targetAudio = document.getElementById('audio' + idx);
      if (targetAudio) {
        targetAudio.play();
      } else {
        console.error("Audio element not found for idx:", idx);
      }
    }
  </script>
</body>

</html>
